name: Android Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build QuantraVision Apex
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # ============================================================
      # CHECKOUT & ENVIRONMENT SETUP
      # ============================================================
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      
      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # ============================================================
      # CACHE SETUP
      # ============================================================
      
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # ============================================================
      # CODE QUALITY CHECKS
      # ============================================================
      
      - name: Run Lint
        run: ./gradlew lint --no-daemon --stacktrace
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
      
      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 30
      
      # ============================================================
      # UNIT TESTS
      # ============================================================
      
      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30
      
      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      
      - name: Clean build and Gradle cache
        run: |
          ./gradlew clean --no-daemon
          rm -rf ~/.gradle/caches/modules-2/metadata-*
          rm -rf ~/.gradle/configuration-cache
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace --warning-mode=all 2>&1 | tee build-debug.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g -Dorg.gradle.configuration-cache=false"
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quantravision-apex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      # ============================================================
      # BUILD RELEASE APK (UNSIGNED)
      # ============================================================
      
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode=all 2>&1 | tee build-release.log || true
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g"
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quantravision-apex-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      # ============================================================
      # ERROR EXTRACTION & REPORTING
      # ============================================================
      
      - name: Extract build errors
        if: always()
        run: |
          mkdir -p build-logs
          
          # Extract Kotlin compilation errors from debug build
          if [ -f build-debug.log ]; then
            grep -A 5 "e: file:" build-debug.log > build-logs/compilation-errors-debug.txt || echo "No compilation errors found in debug build" > build-logs/compilation-errors-debug.txt
            cp build-debug.log build-logs/full-build-debug.log
          fi
          
          # Extract Kotlin compilation errors from release build
          if [ -f build-release.log ]; then
            grep -A 5 "e: file:" build-release.log > build-logs/compilation-errors-release.txt || echo "No compilation errors found in release build" > build-logs/compilation-errors-release.txt
            cp build-release.log build-logs/full-build-release.log
          fi
          
          # Error summary
          DEBUG_ERRORS=$(grep -c 'e: file:' build-logs/compilation-errors-debug.txt 2>/dev/null || echo 0)
          RELEASE_ERRORS=$(grep -c 'e: file:' build-logs/compilation-errors-release.txt 2>/dev/null || echo 0)
          
          echo "Debug build errors: $DEBUG_ERRORS" > build-logs/error-summary.txt
          echo "Release build errors: $RELEASE_ERRORS" >> build-logs/error-summary.txt
          
          cat build-logs/error-summary.txt
      
      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-logs/
          retention-days: 30
      
      # ============================================================
      # BUILD SUMMARY
      # ============================================================
      
      - name: Generate Build Summary
        if: always()
        run: |
          echo "# 📦 QuantraVision Apex Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Lint Results
          echo "## 🔍 Code Quality" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/reports/lint-results-debug.html ]; then
            echo "✅ Lint completed - check artifacts for details" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Lint results not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test Results
          echo "## 🧪 Unit Tests" >> $GITHUB_STEP_SUMMARY
          if [ -d app/build/test-results ]; then
            TEST_COUNT=$(find app/build/test-results -name "*.xml" -exec grep -h "tests=" {} \; | grep -oP 'tests="\K[0-9]+' | awk '{s+=$1} END {print s}' || echo 0)
            FAILURE_COUNT=$(find app/build/test-results -name "*.xml" -exec grep -h "failures=" {} \; | grep -oP 'failures="\K[0-9]+' | awk '{s+=$1} END {print s}' || echo 0)
            
            if [ "$FAILURE_COUNT" -eq "0" ]; then
              echo "✅ All $TEST_COUNT tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $FAILURE_COUNT of $TEST_COUNT tests failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Test results not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Debug APK
          echo "## 📱 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            echo "✅ **Debug APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print $9, "-", $5}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Debug APK build failed**" >> $GITHUB_STEP_SUMMARY
            if [ -f build-logs/compilation-errors-debug.txt ]; then
              ERROR_COUNT=$(grep -c 'e: file:' build-logs/compilation-errors-debug.txt 2>/dev/null || echo 0)
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Compilation errors found:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Click to see first 20 errors</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -50 build-logs/compilation-errors-debug.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Release APK
          echo "### Release APK (Unsigned)" >> $GITHUB_STEP_SUMMARY
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "✅ **Release APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/release/*.apk | awk '{print $9, "-", $5}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ *Note: This APK is unsigned and cannot be installed. Configure signing for production.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Release APK build skipped or failed** (needs signing configuration)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Artifacts
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **quantravision-apex-debug-apk** - Debug APK ready to install" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **lint-results** - Code quality report" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 **test-results** - Unit test results" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 **build-logs** - Complete build logs and error details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Build completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
