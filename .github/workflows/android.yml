name: QuantraVision Studio
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qv-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: quantravision-v4-development-signing
      - name: Reproduce the external-image evaluation
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.0.0
          python3 scripts/check-inputs.py
          python3 scripts/evaluate-real-charts.py --check
      - name: Core regressions, lint, and both APKs
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug --no-daemon --stacktrace
      - name: Record the built APK identity
        run: |
          mkdir -p device-bundle verified-apk
          cp app/build/outputs/apk/debug/app-debug.apk device-bundle/app.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk device-bundle/test.apk
          cp fixture/build/outputs/apk/debug/fixture-debug.apk device-bundle/fixture.apk
          cp device-bundle/app.apk verified-apk/QuantraVision-Studio.apk
          cp benchmarks/real_charts/REPORT.md verified-apk/evaluation.md
          cp benchmarks/real_charts/report.json verified-apk/evaluation.json
          python3 - <<'PY'
          import json,hashlib,os,xml.etree.ElementTree as ET
          from pathlib import Path
          apk=Path('verified-apk/QuantraVision-Studio.apk')
          suites=[ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert counts['tests']==46 and counts['failures']==counts['errors']==counts['skipped']==0
          evaluation=Path('verified-apk/evaluation.json');evidence=json.loads(evaluation.read_text())
          data={'engine':'geometry-3','evaluation_sha256':hashlib.sha256(evaluation.read_bytes()).hexdigest(),'evaluation_counts':evidence['counts'],'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'application_id':'com.lamontlabs.quantravision.next','version':'4.1.0-preview.2','bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'unit_tests':counts}
          Path('verified-apk/build.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs verified-apk/QuantraVision-Studio.apk > verified-apk/signing.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: device-bundle-${{ github.run_number }}
          path: device-bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: QuantraVision-Studio-${{ github.run_number }}
          path: verified-apk/
          if-no-files-found: error
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: device-bundle-${{ github.run_number }}
          path: device-bundle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Complete app workflows on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: bash scripts/device-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-proof-api-${{ matrix.api }}-${{ github.run_number }}
          path: device-proof/
          if-no-files-found: error
  publish:
    needs: [build,device]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuantraVision-Studio-${{ github.run_number }}
          path: release
      - name: Publish the verified APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp release/QuantraVision-Studio.apk "QuantraVision-Studio-${GITHUB_RUN_NUMBER}.apk"
          cat > notes.md <<'NOTES'
          QuantraVision Studio: redesigned chart workspace, interactive zoom/pan, visual pattern atlas with detection criteria, evidence ledger, journal, crop, exports and consent-based live screen capture.

          This universal APK supports Android 8 and newer. Launch **QuantraVision Studio** (the gold Q icon).

          Required gates passed: core pixel/geometry regressions, Android lint, APK signature verification, and complete app workflow tests on Android 8, Android 15 and Android 16. Tests include actual Android screen-capture consent and image capture. Android 15 and Android 16 also exercise the real image picker.

          Measurements describe screenshot geometry. Prices, volume, candle times and trading outcomes are not inferred. No detection-accuracy percentage is claimed. This is a development preview; physical-phone acceptance and recognition limitations are documented in the in-app evidence ledger.
          NOTES
          gh release create "v4.1.0-studio.${GITHUB_RUN_NUMBER}" "QuantraVision-Studio-${GITHUB_RUN_NUMBER}.apk" release/build.json release/signing.txt release/evaluation.md release/evaluation.json --target "$GITHUB_SHA" --prerelease --title "QuantraVision Studio · build ${GITHUB_RUN_NUMBER}" --notes-file notes.md
