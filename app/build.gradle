plugins { id 'com.android.application' }
tasks.register('prepareStudioAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare-assets.py'
}
tasks.named('preBuild').configure { dependsOn 'prepareStudioAssets' }
android {
    namespace 'com.lamontlabs.quantravision.next'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lamontlabs.quantravision.studio'
        minSdk 26
        targetSdk 35
        versionCode 40101
        versionName '4.1.0-preview.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('QV_DEBUG_KEYSTORE') ?: "${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { animationsDisabled true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
